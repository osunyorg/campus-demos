        <p>Démos œuvre en faveur de la démocratisation culturelle par la pratique musicale en orchestre et forme les futurs citoyens du XXI<sup>e</sup> siècle. Il propose un apprentissage de la musique classique à des enfants de 7 à 12 ans éloignés de cette pratique pour des raisons économiques, sociales ou géographiques.</p><p>Initié en 2010 et coordonné par la Cité de la musique - Philharmonie de Paris, Démos se déploie sur le territoire national en lien avec les collectivités territoriales.</p>
